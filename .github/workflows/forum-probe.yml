name: Probe ExamTopics forum
on:
  workflow_dispatch:
  push:
    branches: [fix/validated-exam-downloads]
    paths: [.github/workflows/forum-probe.yml]
permissions:
  contents: read
concurrency: quizzs-examtopics-forum
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quizzs-forum-downloader:local downloader
      - name: Run the patched CloudOps downloader across canonical forum pages
        run: |
          state="$(mktemp -d)"
          code=0
          timeout 30s docker run --rm --name quizzs-forum-probe \
            -v "$state:/state" quizzs-forum-downloader:local \
            -p amazon -s aws-certified-cloudops-engineer-associate-soa-c03 \
            > "$RUNNER_TEMP/forum-probe.log" 2>&1 || code=$?
          docker stop -t 1 quizzs-forum-probe >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/forum-probe.log"
          printf 'HTTP 429 responses observed: %s\n' "$(grep -c '^HTTP 429' "$RUNNER_TEMP/forum-probe.log" || true)"
          printf 'Downloader exit: %s\n' "$code"
          exit "$code"
