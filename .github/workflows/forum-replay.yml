name: Replay known CloudOps discussions
on:
  workflow_dispatch:
  push:
    branches: [fix/validated-exam-downloads]
    paths: [.github/workflows/forum-replay.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: quizzs-examtopics-forum
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quizzs-forum-downloader:local downloader
      - name: Reuse the previous discovery run and measure community answers and the replacement threshold
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(mktemp -d)"
          exam=aws-certified-cloudops-engineer-associate-soa-c03
          gh run view 44539633601 --job 135614343446 --log --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/previous-scan.log"
          python3 - "$RUNNER_TEMP/previous-scan.log" "$state/amazon-index.json" <<'PY'
          import datetime, json, pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          links = sorted(set(re.findall(r'Discussion without a complete question: (https://www\.examtopics\.com/discussions/amazon/view/[a-z0-9-]+-exam-aws-certified-cloudops-engineer-associate-soa-c03-topic-[0-9]+-question-[0-9]+-discussion/)', log)))
          if len(links) != 197:
              raise SystemExit(f"Expected 197 previously found links, got {len(links)}")
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"PageCount":609,"NextPage":610,"Links":links,"CompletedAt":datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          print(f"Replaying {len(links)} existing links without requesting index pages")
          PY
          code=0
          docker run --rm --user "$(id -u):$(id -g)" -v "$state:/state" quizzs-forum-downloader:local \
            -p amazon -s "$exam" -o "/state/$exam.md" 2>&1 | tee "$RUNNER_TEMP/replay.log" || code=$?
          printf 'HTTP 429 responses: %s · Exit: %s\n' "$(grep -c '^HTTP 429' "$RUNNER_TEMP/replay.log" || true)" "$code"
          python3 - "$state/amazon_$exam.json" <<'PY'
          import json, pathlib, re, sys
          state = pathlib.Path(sys.argv[1])
          data = json.loads(state.read_text()) if state.exists() else {}
          items = data.get("Questions", {}).values()
          numbers = {int(m[1]) for q in items if (m := re.search(r'topic\s+1\s+question\s+(\d+)\b', q.get("title", ""), re.I))}
          print("Questions parsed:",len(numbers),"/",data.get("Total",200))
          print("Explicit answers:",sum(bool(q.get("answer")) for q in items))
          print("Missing topic 1 numbers:", sorted(set(range(1,data.get("Total",200)+1))-numbers))
          PY
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          node - "$state/$exam.md" "$RUNNER_TEMP/replay.log" <<'JS'
          const fs = require('node:fs');
          const {parseQuestionsMarkdown} = require('./public/parser');
          const {reviewForumDownload} = require('./forum');
          const markdown = fs.readFileSync(process.argv[2], 'utf8');
          const log = fs.readFileSync(process.argv[3], 'utf8');
          const coverage = log.match(/^Coverage: (\d+)\/(\d+) questions, (\d+) explicit answers, (\d+) available$/m);
          if (!coverage) throw new Error('Coverage line missing.');
          const questions = parseQuestionsMarkdown(markdown);
          console.log('Parsed conversation replies:', questions.reduce((n, q) => n + q.discussions.length, 0));
          console.log('Questions with parsed conversations:', questions.filter(q => q.discussions.length).length);
          console.log('Questions with a community answer:', questions.filter(q => q.answerConfidence === 1).length);
          console.log('Questions with an answer and supporting explanation:', questions.filter(q => q.correctAnswer && q.explanation).length);
          const reviewed = reviewForumDownload(markdown, Number(coverage[4]), Number(coverage[1]));
          console.log('Replacement quality gate passed:', reviewed.count, '/', coverage[4]);
          JS
