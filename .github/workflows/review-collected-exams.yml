name: Review and save collected exams
on:
  workflow_dispatch:
  push:
    branches: [fix/validated-exam-downloads]
    paths: [.github/workflows/review-collected-exams.yml]
permissions:
  actions: read
  contents: write
concurrency: quizzs-reviewed-exams
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validated-exam-downloads
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for collection and review complete results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 345); do
            status="$(gh run view 44637088853 --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
            if [ "$status" = completed ]; then break; fi
            sleep 60
          done
          if [ "$status" != completed ]; then echo 'Collection still running'; exit 1; fi
          mkdir -p "$RUNNER_TEMP/collected"
          gh run download 44637088853 --repo "$GITHUB_REPOSITORY" -n collected-exams -D "$RUNNER_TEMP/collected"
          find "$RUNNER_TEMP/collected" -type f | head -20
          node .github/scripts/review-exam-banks.js "$RUNNER_TEMP/collected"
      - name: Commit accepted exams to the branch
        shell: bash
        run: |
          if [ ! -d shared-exams ] || [ -z "$(find shared-exams -name '*.md' -print -quit)" ]; then
            echo 'No exam met the quality threshold.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared-exams/*.md
          git diff --cached --quiet && exit 0
          git commit -m "Add validated shared exam banks"
          git pull --rebase origin fix/validated-exam-downloads
          git push origin HEAD:fix/validated-exam-downloads
